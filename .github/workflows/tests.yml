name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '9'
            illuminate: '^9.52.21'
            testbench: '^7.56'
            phpunit: '^9.6.34'
            audit: false
          - php: '8.1'
            laravel: '10'
            illuminate: '^10.50.2'
            testbench: '^8.37'
            phpunit: '^10.5.63'
            audit: false
          - php: '8.2'
            laravel: '10'
            illuminate: '^10.50.2'
            testbench: '^8.37'
            phpunit: '^10.5.63'
            audit: false
          - php: '8.2'
            laravel: '11'
            illuminate: '^11.54'
            testbench: '^9.17'
            phpunit: '^11.5.55'
            audit: false
          - php: '8.2'
            laravel: '12'
            illuminate: '^12.61'
            testbench: '^10.11'
            phpunit: '^11.5.55'
            audit: true
          - php: '8.3'
            laravel: '11'
            illuminate: '^11.54'
            testbench: '^9.17'
            phpunit: '^11.5.55'
            audit: false
          - php: '8.3'
            laravel: '12'
            illuminate: '^12.61'
            testbench: '^10.11'
            phpunit: '^11.5.55'
            audit: true
          - php: '8.3'
            laravel: '13'
            illuminate: '^13.13'
            testbench: '^11.1'
            phpunit: '^11.5.55'
            audit: true
          - php: '8.4'
            laravel: '12'
            illuminate: '^12.61'
            testbench: '^10.11'
            phpunit: '^11.5.55'
            audit: true
          - php: '8.4'
            laravel: '13'
            illuminate: '^13.13'
            testbench: '^11.1'
            phpunit: '^11.5.55'
            audit: true

    env:
      COMPOSER_ROOT_VERSION: 3.1.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, mbstring, pdo, sqlite, xml
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Allow compatibility installs for EOL Laravel majors
        if: ${{ matrix.audit == false }}
        run: composer config audit.block-insecure false

      - name: Install matrix dependencies
        run: |
          composer update \
            "illuminate/contracts:${{ matrix.illuminate }}" \
            "illuminate/support:${{ matrix.illuminate }}" \
            "illuminate/console:${{ matrix.illuminate }}" \
            "illuminate/database:${{ matrix.illuminate }}" \
            "illuminate/filesystem:${{ matrix.illuminate }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}" \
            --with-all-dependencies \
            --no-interaction \
            --prefer-dist \
            --no-audit

      - name: Audit dependencies
        if: ${{ matrix.audit == true }}
        run: composer audit

      - name: Run test suite
        run: composer test
